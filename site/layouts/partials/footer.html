<!-- Footer -->
<footer class="mt-32 text-center">
    <div class="max-w-3xl mx-auto">
        <div class="border-t border-border-primary-light dark:border-border-primary-dark pt-5">
            <div class="flex flex-col items-center justify-center gap-2">
                <a class="footer-to-top" href="#page-top" aria-label="{{ T "backToTop" }}" title="{{ T "backToTop" }}">
                    <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true"><path d="M8 0L16 12H0Z"/></svg>
                </a>
                {{ $authorData := index hugo.Data .Language.Lang "author" }}
                {{ $author := cond (and $authorData $authorData.author) $authorData.author site.Params }}
                {{ with $author }}
                <p class="text-text-secondary-light dark:text-text-secondary-dark text-xm ">© {{ now.Format "2006" }} {{ .name }}</p>
                <p class="text-text-secondary-light dark:text-text-secondary-dark text-xm pb-12">{{ T "builtUsing" }} <a href="https://gohugo.io/" target="_blank" class="animated-link text-accent-light dark:text-accent-dark hover:text-text-primary-light dark:hover:text-text-primary-dark">Hugo</a>. {{ T "takeALookAtMy" }} <a href="{{ .github }}" target="_blank" class="animated-link text-accent-light dark:text-accent-dark hover:text-text-primary-light dark:hover:text-text-primary-dark">GitHub</a></p>
                {{ end }}
            </div>
        </div>
    </div>
</footer>

<style>
    .footer-to-top {
        position: fixed;
        right: max(1.25rem, env(safe-area-inset-right));
        bottom: max(1.25rem, env(safe-area-inset-bottom));
        z-index: 40;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        color: #374151;
        background: rgba(255, 255, 255, .65);
        border: 1px solid rgba(17, 24, 39, .18);
        border-radius: 50%;
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, .16);
        text-decoration: none;
        touch-action: manipulation;
        transition: background-color .15s, border-color .15s;
    }
    .dark .footer-to-top {
        color: #f3f4f6;
        background: rgba(45, 45, 45, .65);
        border-color: rgba(255, 255, 255, .28);
    }
    .footer-to-top:hover { background: rgba(255, 255, 255, .85); }
    .dark .footer-to-top:hover { background: rgba(65, 65, 65, .85); }
    .footer-to-top:focus-visible { outline: 2px solid #38bdf8; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { .footer-to-top { transition: none; } }

    .animated-link {
        position: relative;
        display: inline-flex;
        align-items: center;
    }

    .animated-link::after {
        content: '';
        position: absolute;
        width: 0;
        height: 1px;
        bottom: -1px;
        left: 0;
        background-color: #0284c7; /* accent-light (sky-600) */
        transition: width 0.3s ease-in-out;
    }

    .animated-link:hover::after {
        width: 100%;
    }
    html.dark .animated-link::after {
        background-color: #0ea5e9; /* accent-dark (sky-500) */
    }
</style>
