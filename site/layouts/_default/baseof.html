<!DOCTYPE html>
<html lang="{{ .Language.Lang }}">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>

        <!-- Custom gamepad favicon -->
        <link rel="shortcut icon" href="{{ "favicon_io/gamepad.ico" | absURL }}?v=2">
        <link rel="icon" type="image/png" sizes="16x16" href="{{ "favicon_io/gamepad-16.png" | absURL }}?v=2">
        <link rel="icon" type="image/png" sizes="32x32" href="{{ "favicon_io/gamepad-32.png" | absURL }}?v=2">
        <link rel="icon" type="image/svg+xml" sizes="any" href="{{ "favicon_io/gamepad.svg" | absURL }}?v=2">
        <link rel="apple-touch-icon" sizes="180x180" href="{{ "favicon_io/apple-touch-icon.png" | absURL }}?v=2">
        <link rel="manifest" href="{{ "favicon_io/site.webmanifest" | absURL }}?v=2">
        <link rel="preload" href="{{ "css/tailwind.css" | absURL }}" as="style">
        <link rel="preload" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" as="style">
        <style>
            .carousel-item {
                display: inline-block;
                margin: 0 1rem;
            }
            .tech-carousel {
                overflow: hidden;
                width: 100%;
                padding: 1rem 0;
            }
            .carousel-track {
                white-space: nowrap;
            }
        </style>

        <link rel="stylesheet" href="{{ "css/tailwind.css" | absURL }}">
        <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
        <script>
            if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        </script>
        <style>
            :root {
                color-scheme: light dark;
            }

            .tech-icon {
                filter: grayscale(100%) brightness(200%);
                transition: all 0.3s ease;
            }
            .tech-icon:hover {
                filter: none;
            }

            @keyframes scroll {
                0% {
                    transform: translateX(0);
                }
                100% {
                    transform: translateX(-100%);
                }
            }

            .tech-carousel {
                width: 100%;
                padding: 1rem 0;
            }

            .tech-track {
                width: fit-content;
                animation: scroll 20s linear infinite;
            }

            .tech-track:hover {
                animation-play-state: paused;
            }

            .tech-slide {
                float: left;
            }
        </style>
    </head>
    <body id="page-top" tabindex="-1" class="min-h-screen bg-bg-primary-light dark:bg-bg-primary-dark text-text-primary-light dark:text-text-primary-dark">
        {{ partial "header" . }}
        <main>
            {{ block "main" . }}{{ end }}
        </main>
        {{ partial "footer" . }}
    </body>
</html>
